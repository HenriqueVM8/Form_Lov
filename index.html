<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário | Henrique</title>

    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="images/love.png" type="image/x-icon">
</head>
<body>
    <header>
        <h1>Preencha o formulário</h1>
    </header>

    <form id="contact-form">
        <label for="nome">Nome:</label>
        <input type="text" name="name" id="nome" placeholder="Seu nome" required>

        <label for="numero">Nota de 0 a 10 para a surpresa: </label>
        <input type="number" name="number" id="numero">
        

        <label for="mensagem">O que te faz me amar: </label>
        <textarea id="mensagem" name="message" placeholder="Digite sua mensagem" required></textarea>

        <button type="submit">Enviar</button>
    </form>
</body>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="javaScript.js"></script>
</html>
